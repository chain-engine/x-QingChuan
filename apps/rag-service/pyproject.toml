[project]
name = "qingchuan-rag"
version = "0.1.0"
description = "晴川 rag-service：人社（HRSS）数据离线索引 + RAG（检索增强生成）一体化服务平台"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "John Young", email = "john.young@foxmail.com" },
]
license = { text = "MIT" }
keywords = ["rag", "retrieval-augmented-generation", "llm", "vector-database", "hrss"]

dependencies = [
  "qingchuan-domain",
  # Web / API
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "python-multipart>=0.0.6",
  "slowapi>=0.1.9",
  "mcp>=2.3.0",
  # 配置 / 日志
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
  "loguru>=0.7.0",
  "pydantic>=2.5.0",
  # 向量 / 嵌入 / 稀疏检索
  "chromadb>=0.4.18",
  "sentence-transformers>=2.2.2",
  # 部署机无 GPU：torch 走 CPU-only 索引（见 tool.uv.sources），避免捆绑约 4GB nvidia CUDA 库
  "torch==2.12.0",
  "numpy>=1.24.0",
  "rank-bm25>=0.2.2",
  # 文本切分 / LLM
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain",
  "langchain-text-splitters>=1.1.2",
  # LlamaIndex 切分后端（llamaindex provider：sentence/token/semantic/markdown 策略）
  "llama-index-core>=0.14.25",
  "openai>=1.0.0",
  "httpx>=0.25.0",
  # 业务数据库（审计 / 同步任务状态，MySQL；本地可 SQLite）
  "sqlalchemy>=2.0.0",
  "pymysql>=1.2.3",
  # 周期调度（人社数据同步）
  "apscheduler>=3.10,<4",
  "pymilvus>=2.4.0",
  "milvus-lite>=2.4.0",
  "huggingface-hub>=0.24,<1",
  "transformers>=4.41,<5",
]

[tool.uv.sources]
qingchuan-domain = { workspace = true }
# torch 固定从 CPU-only 索引拉取（index 定义见下方 [[tool.uv.index]] pytorch-cpu）
torch = { index = "pytorch-cpu" }

[project.scripts]
qingchuan-rag-api = "qingchuan_rag.cli:main"
qingchuan-pipeline = "qingchuan_rag.pipeline.cli:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# CPU-only PyTorch 索引：仅 torch 显式引用（explicit=true），其余依赖仍走上方默认镜像
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qingchuan_rag"]

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.1.5",
  "pre-commit>=3.5.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
]
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "api: marks tests as API tests",
]
asyncio_mode = "auto"

# ruff 规则对齐观海（x-GuanHai）：E501/B008 为观海既有风格，照搬保留；
# UP046 为观海 Generic[T] 结构（py311 写法），运行在 py313 但保持结构不改
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["qingchuan_rag", "qingchuan_domain"]
