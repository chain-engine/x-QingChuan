[project]
name = "qingchuan-rag"
version = "0.2.0"
description = "晴川 RAG 服务：HTTP + MCP 双协议，承载人社离线数据同步、语义检索与生成问答"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "John Young", email = "john.young@foxmail.com" },
]
license = { text = "MIT" }
keywords = ["rag", "retrieval-augmented-generation", "llm", "vector-database", "hrss"]

dependencies = [
  "qingchuan-domain",
  # Web / API
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "python-multipart>=0.0.6",
  "slowapi>=0.1.9",
  "mcp>=2.3.0",
  # 配置 / 日志
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
  "loguru>=0.7.0",
  "pydantic>=2.5.0",
  # 向量 / 嵌入 / 稀疏检索
  "chromadb>=0.4.18",
  "sentence-transformers>=2.2.2",
  "torch==2.12.0",  # 与观海对齐（本机已验证可运行；2.14.x 在 Windows 报 shm.dll 缺失）
  "numpy>=1.24.0",
  "rank-bm25>=0.2.2",
  # 文本切分 / LLM
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain",
  "langchain-text-splitters>=1.1.2",
  "openai>=1.0.0",
  "httpx>=0.25.0",
  # 业务数据库（审计 / 同步任务状态，MySQL；本地可 SQLite）
  "sqlalchemy>=2.0.0",
  "pymysql>=1.2.3",
  # 周期调度（人社数据同步）
  "apscheduler>=3.10,<4",
]

[tool.uv.sources]
qingchuan-domain = { workspace = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[project.scripts]
qingchuan-rag-api = "qingchuan_rag.cli:main"
qingchuan-pipeline = "qingchuan_rag.pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qingchuan_rag"]

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.1.5",
  "pre-commit>=3.5.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
]
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "api: marks tests as API tests",
]
asyncio_mode = "auto"

# ruff 规则对齐观海（x-GuanHai）：E501/B008 为观海既有风格，照搬保留；
# UP046 为观海 Generic[T] 结构（py311 写法），运行在 py313 但保持结构不改
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["qingchuan_rag", "qingchuan_domain"]
