[project]
name = "qingchuan-agent"
version = "0.1.0"
description = "晴川 agent-service：人机交互的多智能体编排平台（LangGraph 编排 + HTTP，经 MCP 工具调用 rag-service）"
requires-python = ">=3.12"
dependencies = [
  "qingchuan-domain",
  "qingchuan-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # MCP 客户端经 packages/common 封装；agent 侧直接复用 qingchuan_common.mcp，
  # 版本约束与 rag-service 对齐（mcp>=2.3.0），保证 workspace 单一版本
  "mcp>=2.3.0,<3",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "loguru>=0.7",
  # 数据访问（SQLAlchemy 2 + MySQL，任务/事件持久化）
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "redis>=8.1.0",
  "langgraph-checkpoint-redis>=0.5.2",
]

[tool.uv.sources]
qingchuan-domain = { workspace = true }
qingchuan-common = { workspace = true }

[project.scripts]
qingchuan-agent = "qingchuan_agent.cli:main"
qingchuan-agent-api = "qingchuan_agent.cli:serve"

# 开发依赖组（与 rag-service 对齐）：pytest-asyncio 供 agent 异步测试使用。
# 此前只声明在 rag 的 dev 组，单包运行 `uv run --package qingchuan-agent pytest`
# 会缺插件；补在此处后单包测试无需再手挂 --with pytest-asyncio。
[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.1.5",
  "pre-commit>=3.5.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qingchuan_agent"]
