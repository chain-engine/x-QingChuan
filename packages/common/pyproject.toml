[project]
name = "qingchuan-common"
version = "0.2.0"
description = "晴川跨服务通用件：MCP 客户端封装 / 鉴权 / 审计 / 观测（MCP 客户端已实现）"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3.0",
  "httpx2>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qingchuan_common"]
