name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v2
        with:
          args: check .

      - name: Ruff format check
        uses: astral-sh/ruff-action@v2
        with:
          args: format --check .

  test:
    name: Test（pytest + 编译 + 版本）
    runs-on: ubuntu-latest
    needs: lint
    services:
      # 供 agent-service 的 Redis 集成测试使用（event_bus / checkpointer，无密码本地实例）
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      # 按 uv.lock 锁定安装整个 workspace（含 rag 依赖：torch / chromadb 体积较大，
      # 依赖 setup-uv 缓存加速二次运行）
      - name: Install workspace（--frozen）
        run: uv sync --frozen

      # 全包编译检查（语法/导入错误兜底）
      - name: Compile all packages
        run: uv run --frozen python -m compileall -q apps packages scripts

      # rag-service 测试套件：测试夹具自洽（临时 SQLite + 桩服务），无需外部数据库
      - name: Run rag-service tests
        run: uv run --frozen --package qingchuan-rag pytest apps/rag-service/tests -q

      # agent-service 测试套件（event_bus / checkpointer；Redis 集成用例连 CI 的 redis:7 service，
      # 无密码 localhost:6379，经测试内 QINGCHUAN_AGENT_REDIS_DB=15 隔离）
      - name: Run agent-service tests
        run: uv run --frozen --package qingchuan-agent pytest apps/agent-service/tests -q

      # 人社同步管道 CLI 冒烟：mock 数据端到端走通（写索引 + 任务状态）
      - name: Pipeline smoke（mock 人社同步）
        run: uv run --frozen --package qingchuan-rag python -m qingchuan_rag.pipeline.cli stats

      # 版本一致性：VERSION 与全部 pyproject 必须同版本（防 domain/rag/agent 漂移）
      - name: Check version consistency
        run: uv run --frozen python scripts/bump_version.py --check

  eval:
    name: Eval（golden set + 确定性检索指标）
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install workspace（--frozen）
        run: uv sync --frozen

      # golden set 结构校验（重复 id / 缺失字段 / snippet 空白）
      - name: Validate golden set
        run: uv run --frozen --package qingchuan-eval qingchuan-eval validate

      # 指标 / matcher 单元测试
      - name: Run eval package tests
        run: uv run --frozen --package qingchuan-eval pytest apps/qingchuan-eval/tests -q

      # 轻量端到端冒烟：mock rag-service（离线 2-gram 检索，零模型依赖）跑通
      # golden set → 指标 → 报告全链路；不设检索阈值（真实阈值在本地跑基线后手动调）
      - name: Eval smoke（mock rag-service）
        run: |
          uv run --frozen --package qingchuan-eval python apps/qingchuan-eval/scripts/mock_rag_service.py &
          MOCK_PID=$!
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8010/docs", timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("mock rag-service 启动超时")
          PY
          uv run --frozen --package qingchuan-eval qingchuan-eval run \
            --base-url http://127.0.0.1:8010 \
            --mode retrieval \
            --output eval-report.json
          kill $MOCK_PID 2>/dev/null || true
          python - <<'PY'
          import json
          with open("eval-report.json", encoding="utf-8") as f:
              report = json.load(f)
          agg = report["aggregate"]
          assert report["all_thresholds_passed"] is None or report["all_thresholds_passed"]
          assert agg["sample_count"] > 0, "无样本评测，冒烟无效"
          print(
              f"eval smoke OK: samples={agg['sample_count']} "
              f"hit@3={agg['hit_at_3']} MRR={agg['mrr']} "
              f"recall@3={agg['recall_at_3']} err={agg['error_rate']}"
          )
          PY
