<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 800" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="晴川（QingChuan）总体架构图" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="490" y="22" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">晴川（QingChuan）— 总体架构</text>
  <text x="490" y="44" text-anchor="middle" font-size="13" fill="#64748b">人社数据离线索引 + RAG 检索增强生成 + 多 Agent 编排（一期聚焦智能问答）</text>

  <!-- 第 1 层：客户端 -->
  <rect x="80" y="58" width="380" height="66" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="270" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">HTTP 客户端（REST）</text>
  <text x="270" y="108" text-anchor="middle" font-size="13" fill="#334155">curl / SDK / 前端：健康 · 任务 · 问答 · 审计</text>

  <rect x="520" y="58" width="380" height="66" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="710" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">MCP 客户端（Agent / IDE / 工具）</text>
  <text x="710" y="108" text-anchor="middle" font-size="13" fill="#334155">Streamable HTTP /mcp · retrieve_docs · rag_query</text>

  <!-- 客户端 → 服务层 -->
  <line x1="270" y1="124" x2="285" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="300" y1="124" x2="660" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="124" x2="695" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="140" text-anchor="middle" font-size="13" fill="#475569">HTTP :8010 / :8020 · MCP :8010/mcp</text>

  <!-- 第 2 层：服务容器 -->
  <rect x="70" y="170" width="840" height="380" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="490" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">晴川服务层（两服务独立部署 · compose 内部网络互通）</text>

  <!-- agent-service 块 -->
  <rect x="90" y="210" width="390" height="300" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="285" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">agent-service（qingchuan-agent · :8020）</text>

  <rect x="100" y="248" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">API 层 /api/v1</text>
  <text x="285" y="284" text-anchor="middle" font-size="12" fill="#14532d">health · version · agents · tasks · events</text>

  <rect x="100" y="304" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">服务层 AgentTaskService</text>
  <text x="285" y="340" text-anchor="middle" font-size="12" fill="#14532d">提交 → 路由 → 执行 → 聚合 → 落库 / 回写</text>

  <rect x="100" y="360" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">编排层 LangGraph</text>
  <text x="285" y="396" text-anchor="middle" font-size="12" fill="#14532d">route → subagent → aggregate · interrupt / resume</text>

  <rect x="100" y="416" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">仓储层 repositories</text>
  <text x="285" y="452" text-anchor="middle" font-size="12" fill="#14532d">agent_task / agent_event（可选 MySQL）</text>

  <text x="285" y="486" text-anchor="middle" font-size="12" fill="#3f6212">新业务 Agent 在 agents/ 注册即可挂载为顶层图节点</text>

  <!-- rag-service 块 -->
  <rect x="500" y="210" width="390" height="300" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="695" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">rag-service（qingchuan-rag · :8010）</text>

  <rect x="510" y="248" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">网关层 HTTP /api/v1 + MCP /mcp</text>
  <text x="695" y="284" text-anchor="middle" font-size="12" fill="#1e3a8a">Streamable HTTP · 统一响应包装与异常处理</text>

  <rect x="510" y="304" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">服务层 rag / document / sync / audit</text>
  <text x="695" y="340" text-anchor="middle" font-size="12" fill="#1e3a8a">RAG 问答 · 文档索引 · 人社同步 · 审计留痕</text>

  <rect x="510" y="360" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">RAG 流水线 + 混合检索</text>
  <text x="695" y="396" text-anchor="middle" font-size="12" fill="#1e3a8a">向量 + BM25 增量倒排 + MMR 重排 · 查询理解</text>

  <rect x="510" y="416" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">仓储层 repositories</text>
  <text x="695" y="452" text-anchor="middle" font-size="12" fill="#1e3a8a">document / vector / bm25 / sync_task / audit_log</text>

  <text x="695" y="486" text-anchor="middle" font-size="12" fill="#1e40af">离线同步（CLI / APScheduler / HTTP 触发）→ 人社数据</text>

  <!-- agent → rag（MCP 工具调用） -->
  <line x1="480" y1="382" x2="500" y2="382" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="374" text-anchor="middle" font-size="12" fill="#475569">MCP 工具调用</text>

  <!-- 服务层 → 基础设施（虚线） -->
  <line x1="90" y1="574" x2="910" y2="574" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="132" y1="574" x2="132" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="270" y1="574" x2="270" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="408" y1="574" x2="408" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="546" y1="574" x2="546" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="684" y1="574" x2="684" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="822" y1="574" x2="822" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>

  <!-- 第 3 层：基础设施 -->
  <rect x="70" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="132" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">MySQL 8.0</text>
  <text x="132" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">审计 / 同步任务 /</text>
  <text x="132" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">Agent 任务与事件</text>
  <text x="132" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">utf8mb4</text>

  <rect x="208" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="270" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Redis 7</text>
  <text x="270" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">agent checkpoint /</text>
  <text x="270" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">事件总线</text>
  <text x="270" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">生产强制启用</text>

  <rect x="346" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="408" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Milvus（可选）</text>
  <text x="408" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">默认 Chroma</text>
  <text x="408" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">本地持久化</text>
  <text x="408" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">etcd+MinIO+standalone</text>

  <rect x="484" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="546" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">BM25 稀疏索引</text>
  <text x="546" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">增量倒排 · O(词数)</text>
  <text x="546" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">关键词匹配</text>
  <text x="546" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">与向量检索混合</text>

  <rect x="622" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="684" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">LLM Provider</text>
  <text x="684" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">OpenAI 兼容协议</text>
  <text x="684" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">DeepSeek / 豆包 /</text>
  <text x="684" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">百炼 / MiMo</text>

  <rect x="760" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="822" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">人社数据源</text>
  <text x="822" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">HRSS API</text>
  <text x="822" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">离线周期同步</text>
  <text x="822" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">mock 联调</text>

  <!-- 图例 -->
  <line x1="90" y1="736" x2="150" y2="736" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="160" y="740" font-size="13" fill="#334155">HTTP 请求 / MCP 调用</text>
  <line x1="380" y1="736" x2="440" y2="736" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <text x="450" y="740" font-size="13" fill="#334155">数据读写 / 外部服务调用</text>
  <text x="90" y="770" font-size="13" fill="#64748b">注：默认向量库 Chroma（本地持久化，零外部依赖）；可选 Milvus（compose --profile milvus 启用 etcd + MinIO + standalone）。混合检索 = 向量 + BM25 增量 + MMR；agent 经 MCP 调用 rag-service。</text>
</svg>
