<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 800" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QingChuan Overall Architecture" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="490" y="22" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">QingChuan — Overall Architecture</text>
  <text x="490" y="44" text-anchor="middle" font-size="13" fill="#64748b">HRSS data offline indexing + RAG + multi-agent orchestration (Phase 1 focuses on intelligent Q&amp;A)</text>

  <!-- Layer 1: Clients -->
  <rect x="80" y="58" width="380" height="66" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="270" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">HTTP Clients (REST)</text>
  <text x="270" y="108" text-anchor="middle" font-size="13" fill="#334155">curl / SDK / frontends: health · tasks · Q&amp;A · audit</text>

  <rect x="520" y="58" width="380" height="66" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="710" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">MCP Clients (Agent / IDE / Tools)</text>
  <text x="710" y="108" text-anchor="middle" font-size="13" fill="#334155">Streamable HTTP /mcp · retrieve_docs · rag_query</text>

  <!-- Clients → service layer -->
  <line x1="270" y1="124" x2="285" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="300" y1="124" x2="660" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="124" x2="695" y2="166" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="140" text-anchor="middle" font-size="13" fill="#475569">HTTP :8010 / :8020 · MCP :8010/mcp</text>

  <!-- Layer 2: service container -->
  <rect x="70" y="170" width="840" height="380" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="490" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">QingChuan Service Layer (two independently deployed services · compose internal network)</text>

  <!-- agent-service block -->
  <rect x="90" y="210" width="390" height="300" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="285" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">agent-service (qingchuan-agent · :8020)</text>

  <rect x="100" y="248" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">API Layer /api/v1</text>
  <text x="285" y="284" text-anchor="middle" font-size="12" fill="#14532d">health · version · agents · tasks · events</text>

  <rect x="100" y="304" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Service Layer AgentTaskService</text>
  <text x="285" y="340" text-anchor="middle" font-size="12" fill="#14532d">submit → route → execute → aggregate → persist / write back</text>

  <rect x="100" y="360" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Orchestration Layer LangGraph</text>
  <text x="285" y="396" text-anchor="middle" font-size="12" fill="#14532d">route → subagent → aggregate · interrupt / resume</text>

  <rect x="100" y="416" width="370" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="285" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Repository Layer</text>
  <text x="285" y="452" text-anchor="middle" font-size="12" fill="#14532d">agent_task / agent_event (optional MySQL)</text>

  <text x="285" y="486" text-anchor="middle" font-size="12" fill="#3f6212">New agents register under agents/ and mount as top-level graph nodes</text>

  <!-- rag-service block -->
  <rect x="500" y="210" width="390" height="300" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="695" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">rag-service (qingchuan-rag · :8010)</text>

  <rect x="510" y="248" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Gateway HTTP /api/v1 + MCP /mcp</text>
  <text x="695" y="284" text-anchor="middle" font-size="12" fill="#1e3a8a">Streamable HTTP · unified response wrapper &amp; exception handling</text>

  <rect x="510" y="304" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Service Layer rag / document / sync / audit</text>
  <text x="695" y="340" text-anchor="middle" font-size="12" fill="#1e3a8a">RAG Q&amp;A · document indexing · HRSS sync · audit trail</text>

  <rect x="510" y="360" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">RAG Pipeline + Hybrid Retrieval</text>
  <text x="695" y="396" text-anchor="middle" font-size="12" fill="#1e3a8a">vector + BM25 incremental inverted + MMR rerank · query understanding</text>

  <rect x="510" y="416" width="370" height="44" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="695" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Repository Layer</text>
  <text x="695" y="452" text-anchor="middle" font-size="12" fill="#1e3a8a">document / vector / bm25 / sync_task / audit_log</text>

  <text x="695" y="486" text-anchor="middle" font-size="12" fill="#1e40af">Offline sync (CLI / APScheduler / HTTP trigger) → HRSS data</text>

  <!-- agent → rag (MCP tool call) -->
  <line x1="480" y1="382" x2="500" y2="382" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="374" text-anchor="middle" font-size="12" fill="#475569">MCP tool call</text>

  <!-- Service layer → infra (dashed) -->
  <line x1="90" y1="574" x2="910" y2="574" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="132" y1="574" x2="132" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="270" y1="574" x2="270" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="408" y1="574" x2="408" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="546" y1="574" x2="546" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="684" y1="574" x2="684" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <line x1="822" y1="574" x2="822" y2="598" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>

  <!-- Layer 3: infrastructure -->
  <rect x="70" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="132" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">MySQL 8.0</text>
  <text x="132" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">audit / sync tasks /</text>
  <text x="132" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">agent tasks &amp; events</text>
  <text x="132" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">utf8mb4</text>

  <rect x="208" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="270" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Redis 7</text>
  <text x="270" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">agent checkpoint /</text>
  <text x="270" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">event bus</text>
  <text x="270" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">required in production</text>

  <rect x="346" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="408" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Milvus Vector Store</text>
  <text x="408" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">etcd + MinIO +</text>
  <text x="408" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">standalone</text>
  <text x="408" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">bge-m3 dense vectors</text>

  <rect x="484" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="546" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">BM25 Sparse Index</text>
  <text x="546" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">incremental inverted · O(terms)</text>
  <text x="546" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">keyword matching</text>
  <text x="546" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">hybrid with vector retrieval</text>

  <rect x="622" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="684" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">LLM Provider</text>
  <text x="684" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">OpenAI-compatible</text>
  <text x="684" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">DeepSeek / Doubao /</text>
  <text x="684" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">Bailian / MiMo</text>

  <rect x="760" y="598" width="124" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="822" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">HRSS Data Source</text>
  <text x="822" y="650" text-anchor="middle" font-size="12" fill="#7c2d12">HRSS API</text>
  <text x="822" y="666" text-anchor="middle" font-size="12" fill="#7c2d12">offline periodic sync</text>
  <text x="822" y="688" text-anchor="middle" font-size="12" fill="#7c2d12">mock integration</text>

  <!-- Legend -->
  <line x1="90" y1="736" x2="150" y2="736" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="160" y="740" font-size="13" fill="#334155">HTTP request / MCP call</text>
  <line x1="380" y1="736" x2="440" y2="736" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <text x="450" y="740" font-size="13" fill="#334155">data read/write / external service call</text>
  <text x="90" y="770" font-size="13" fill="#64748b">Note: compose ships Milvus (etcd + MinIO + standalone, internal only); hybrid retrieval = vector + BM25 + MMR; agent calls rag-service via MCP.</text>
</svg>
